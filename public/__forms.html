<!DOCTYPE html>
<html>
  <body>
    <!-- Static form skeleton for Netlify build-time detection. Not shown to users. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="business" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
